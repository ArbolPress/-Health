# Publica Storybook en GitHub Pages cada vez que cambia main.
name: Publicar Storybook

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se cancela la publicación anterior y gana la última
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Storybook
        run: npm run build-storybook

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la web compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
